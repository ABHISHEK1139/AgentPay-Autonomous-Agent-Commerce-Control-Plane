# Development services for later sprints.
#
# Not started by the default test suite: the domain layer requires no external services.
# Requires a running Docker daemon; `docker info` failed on the current development machine.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentpay
      POSTGRES_USER: agentpay
      POSTGRES_PASSWORD: agentpay_local_only
    ports:
      - "5432:5432"
    volumes:
      - agentpay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentpay-postgres:
